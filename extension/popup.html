<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Dub MVP</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <div>
          <h1>Live Dub MVP</h1>
          <p>v0.5.0</p>
        </div>
        <span class="status-chip" data-status>checking</span>
      </header>

      <section class="actions">
        <button class="primary" type="button" data-open>Open panel</button>
        <button type="button" data-close>Close panel</button>
        <button type="button" data-toggle>Toggle</button>
      </section>

      <section class="details" data-details>
        Open a YouTube watch page first.
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
